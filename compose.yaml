name: nuget-repo-cache

services:
  nuget-cache:
    image: bagetter/bagetter:1.6.5
    restart: unless-stopped
    ports:
      - "${NUGET_CACHE_PORT:-5000}:8080"
    environment:
      ApiKey: "${BAGETTER_API_KEY:?Copy .env.example to .env and set BAGETTER_API_KEY}"
      Database__Type: Sqlite
      Database__ConnectionString: "Data Source=/data/db/bagetter.db"
      Storage__Type: FileSystem
      Storage__Path: /data/packages
      Search__Type: Database
      Mirror__Enabled: "true"
      Mirror__PackageSource: https://api.nuget.org/v3/index.json
    volumes:
      - nuget-cache-data:/data

volumes:
  nuget-cache-data:

